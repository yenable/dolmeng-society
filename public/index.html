<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돌멩민국 슬랑이 시장</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='40' fill='%23FF5A2E'/></svg>">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .wrap { max-width: 720px; width: 100%; text-align: center; }
    h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 0 0 32px; font-size: 18px; }
    .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .links a { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 12px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 20px; }
    .links a small { display: block; color: var(--muted); font-weight: 600; font-size: 14px; margin-top: 6px; }
    .links a.main { background: var(--accent); color: #fff; border-color: var(--accent); }
    .links a.main small { color: rgba(255,255,255,.85); }
    @media (max-width: 600px) { .links { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>돌멩민국 슬랑이 시장</h1>
    <p>어떤 화면으로 들어갈까요?</p>
    <div class="links">
      <a class="main" href="/play">학생<small>모둠 노트북</small></a>
      <a href="/display">TV<small>교실 대형 화면</small></a>
      <a href="/admin">교사<small>진행 콘솔 (PIN)</small></a>
    </div>
  </div>
</body>
</html>
